spring.application.name=statistic

location.folder.with.file="/cd/da"

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Disable external security dependencies
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/mock-jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/mock-issuer

# Dummy JWT config
jwt.secret=O0paG3FXdECmuBDw3DqmfV3hv71UuDLKhW1RfAFmYrg=
spring.security.oauth2.resourceserver.jwt.secret=O0paG3FXdECmuBDw3DqmfV3hv71UuDLKhW1RfAFmYrg=
jwt.expiration=3600000

# Dummy Google & Apple IDs
google.clientid=test-client-id
google.clientIdIos=test-client-ios-id
apple.sharedSecret=test-shared-secret
spring.ai.openai.api-key=dasdasdasdsadwqeqwewqedsadasd
# Dummy RabbitMQ (won?t connect)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=test
spring.rabbitmq.password=test

# Disable Eureka
eureka.client.enabled=false

# Dummy Mail settings
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=false

# Disable unnecessary actuator metrics
management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=false
management.endpoint.prometheus.enabled=false
management.prometheus.metrics.export.enabled=false
management.endpoint.health.show-details=always